[project]
name = "ssl2"
version = "3.0.0"
description = "PEP 748 TLS interface with a ClientHello model and parser, JA3, JA4 and Akamai fingerprints, proxies, sockets and streams"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Huynh Bao Bien", email = "276976028+baobien-dev@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/baobien-dev/ssl2"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C901",    # the size of a function is a reading matter, not a count
    "COM812",  # the formatter places trailing commas
    "CPY",     # no copyright headers
    "D",       # no docstrings
    "E501",    # the formatter wraps lines
    "EM",      # a message is written in the raise
    "PLR0911", # returns, branches, statements and arguments are not counted either
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "TC",      # imports stay at the top, not under TYPE_CHECKING
    "TRY003",  # a message is written in the raise
]

[tool.ruff.lint.per-file-ignores]
"src/ssl2/errors.py" = ["N818"]  # RaggedEOF is the name PEP 748 gives it
"src/ssl2/registry.py" = ["N815"]  # IANA names such as brainpoolP256r1 are kept as registered
"tools/*" = ["INP001", "T201"]  # standalone scripts that report to the person running them

[tool.basedpyright]
typeCheckingMode = "strict"
reportImplicitOverride = true
reportImportCycles = true
reportUnnecessaryTypeIgnoreComment = true
